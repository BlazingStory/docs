<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blazing Story</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="icon" href="img/favicon.ico" />
    <meta name="description" content='The clone of "Storybook" for Blazor, a frontend workshop for building UI components and pages in isolation.' />
    <meta property="og:image" content="img/social-preview.png" />
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'none';
      base-uri 'self';
      script-src 'self' 'wasm-unsafe-eval' 'sha256-{importmap}';
      style-src 'self';
      img-src 'self' https://raw.githubusercontent.com https://img.shields.io;
      media-src 'self' https://github.com;
      connect-src 'self' https://huggingface.co https://*.huggingface.co https://*.hf.co;
      worker-src 'self' blob:;
      object-src 'none';
      form-action 'self';
      upgrade-insecure-requests;" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/markdown.css" />
    <link rel="stylesheet" href="css/code-theme.css" />
    <script src="js/theme-initializer.js"></script>
    <script type="importmap"></script>
  </head>

  <body>
    <div id="app">
      <div class="loading-progress">
        <svg aria-label="Loading progress" role="img">
          <title>Loading progress</title>
          <circle r="40%" cx="50%" cy="50%" />
          <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="text"></div>
        <img src="img/logo.svg" alt="Blazing Story icon" />
      </div>
    </div>

    <div id="blazor-error-ui">
      An unhandled error has occurred.
      <a href="." class="reload">Reload</a>
      <span class="dismiss">🗙</span>
    </div>

    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
  </body>
</html>
