<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blazing Story</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="icon" href="img/favicon.ico" />
    <meta name="description" content='The clone of "Storybook" for Blazor, a frontend workshop for building UI components and pages in isolation.' />
    <meta property="og:image" content="img/social-preview.png" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/markdown.css" />
    <link rel="stylesheet" href="css/code-theme.css" />
    <script>
      // Apply the color theme before the first paint to avoid a flash of the wrong theme.
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem("theme");
        } catch (e) {}
        var dark = stored ? stored === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      })();
    </script>
    <script type="importmap"></script>
  </head>

  <body>
    <div id="app">
      <div class="loading-progress">
        <svg aria-label="Loading progress" role="img">
          <title>Loading progress</title>
          <circle r="40%" cx="50%" cy="50%" />
          <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="text"></div>
        <img src="img/logo.svg" alt="Blazing Story icon" />
      </div>
    </div>

    <div id="blazor-error-ui">
      An unhandled error has occurred.
      <a href="." class="reload">Reload</a>
      <span class="dismiss">🗙</span>
    </div>

    <script src="lib/prism/prism.js" data-manual></script>
    <script src="js/site.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
  </body>
</html>
